# Grafana dashboard provisioning — load the pre-built APIX Gateway dashboard
apiVersion: 1

providers:
  - name: 'apix-gateway'
    orgId: 1
    folder: 'APIX Gateway'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards