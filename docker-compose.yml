version: '3.8'

services:
  apix-gateway:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret}
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=*
      - LOG_LEVEL=info
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - apix-network
    volumes:
      - ./plugins.json:/app/plugins.json:ro
      - ./apix.yaml:/app/apix.yaml:ro
      - ./presets:/app/presets:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - apix-network
    command: redis-server --appendonly yes

  dashboard:
    image: nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      - apix-gateway
    networks:
      - apix-network

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - apix-gateway
    restart: unless-stopped
    networks:
      - apix-network

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - apix-network

networks:
  apix-network:
    driver: bridge

volumes:
  redis-data:
  grafana-data:
